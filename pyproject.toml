[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xenopus"
version = "1.1.0.dev0"
description = "Xenopus — self-improving autonomous AI agent runtime (local-first, verifiable, model-agnostic)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "Dearly Febriano Irwansyah", email = "dearlyfebrianoi@gmail.com" }]
keywords = ["ai-agent", "agent-runtime", "autonomous-agent", "agentic-ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies: httpx for the provider layer (hardened async
# HTTP client, timeout/cancel support — ADR-005); textual for the TUI
# (command palette, panels, pilot-testable input model — ADR-021);
# starlette+uvicorn for the local web dashboard with python-multipart
# for form parsing (ADR-022); py-cord for the Discord inbound gateway
# (WebSocket session protocol — ADR-024; aiohttp+typing_extensions
# tree, MIT). stdlib-first elsewhere (ADR-002). All transitive deps
# permissive-licensed.
dependencies = [
  "httpx>=0.28.1",
  "textual>=8.2.8,<9",
  "starlette>=1.6.0,<2",
  "uvicorn>=0.52.4,<1",
  "python-multipart>=0.0.32",
  "py-cord>=2.8.1,<3",
]

[project.scripts]
xenopus = "xenopus.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "mypy>=2.3.1",
  "hypothesis>=6.130.0",
  "pytest-asyncio>=1.4.0",
  "httpx2>=2.12.0",  # Starlette TestClient transport (ADR-022)
]

[tool.hatch.build.targets.wheel]
packages = ["src/xenopus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -m 'not benchmark'"
asyncio_mode = "auto"
markers = [
  "benchmark: on-demand performance benchmarks (excluded from the default run; run with `pytest -m benchmark` or scripts/benchmark.py)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # security (bandit-like)
  "SIM", # simplify
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert usage inside tests is expected
# S603 in the parity guard: subprocess arguments originate from internal
# argparse and module constants — not untrusted input.
"scripts/check_release_parity.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/xenopus", "tests"]
